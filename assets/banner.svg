<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050b14"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25"/>
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    @keyframes floatParticle1 {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes floatParticle2 {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
      50% { transform: translateY(30px) translateX(-20px); opacity: 0.9; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.95); }
      50% { opacity: 0.65; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(0.95); }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes waveMotion {
      0% { transform: translateX(0); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0); }
    }

    .bg-grid { fill: url(#gridPattern); }
    .floating-1 { animation: floatParticle1 7s ease-in-out infinite; }
    .floating-2 { animation: floatParticle2 9s ease-in-out infinite; }
    .pulse-glow { transform-origin: center; animation: pulseGlow 6s ease-in-out infinite; }
    .rotating-orbit { transform-origin: 1040px 180px; animation: rotateRing 28s linear infinite; }
    .wave-line { animation: waveMotion 10s ease-in-out infinite; }
    
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Deep Dark Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" class="bg-grid"/>

  <!-- Ambient Background Glows (stay in background behind text) -->
  <circle cx="150" cy="180" r="220" fill="url(#glowCyan)" class="pulse-glow"/>
  <circle cx="1040" cy="180" r="260" fill="url(#glowPurple)" class="pulse-glow" style="animation-delay: -3s;"/>

  <!-- Dynamic Molecular Network / Orbit Visuals on Right Side -->
  <g class="rotating-orbit" opacity="0.45">
    <circle cx="1040" cy="180" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6"/>
    <circle cx="1040" cy="180" r="150" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 8"/>
    <circle cx="1040" cy="180" r="60" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="5 5"/>
    <!-- Orbital Nodes -->
    <circle cx="1150" cy="180" r="5" fill="#38bdf8"/>
    <circle cx="930" cy="180" r="4" fill="#a855f7"/>
    <circle cx="1040" cy="70" r="6" fill="#06b6d4"/>
    <circle cx="1040" cy="330" r="4" fill="#10b981"/>
    <line x1="1040" y1="180" x2="1150" y2="180" stroke="#38bdf8" stroke-width="0.8" opacity="0.6"/>
    <line x1="1040" y1="180" x2="1040" y2="70" stroke="#06b6d4" stroke-width="0.8" opacity="0.6"/>
    <line x1="1040" y1="180" x2="930" y2="180" stroke="#a855f7" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Dynamic Floating Bio/Chem Particles -->
  <g class="floating-1">
    <circle cx="980" cy="130" r="14" fill="#06b6d4" fill-opacity="0.8" filter="url(#glowFilter)"/>
    <text x="980" y="135" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">N</text>
    <circle cx="1090" cy="220" r="12" fill="#8b5cf6" fill-opacity="0.8" filter="url(#glowFilter)"/>
    <text x="1090" y="224" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">O</text>
    <circle cx="890" cy="250" r="9" fill="#10b981" fill-opacity="0.7"/>
    <line x1="980" y1="130" x2="1040" y2="180" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="1090" y1="220" x2="1040" y2="180" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5"/>
  </g>

  <g class="floating-2">
    <circle cx="1040" cy="180" r="18" fill="#3b82f6" fill-opacity="0.9" filter="url(#glowFilter)"/>
    <text x="1040" y="186" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">C</text>
    <circle cx="1120" cy="110" r="10" fill="#ec4899" fill-opacity="0.8"/>
    <text x="1120" y="114" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">H</text>
    <line x1="1040" y1="180" x2="1120" y2="110" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>

  <!-- Animated Sinusoidal DNA / Wave line in Background -->
  <g class="wave-line" opacity="0.25">
    <path d="M -50 310 Q 150 260 350 310 T 750 310 T 1150 310 T 1350 310" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5"/>
    <path d="M -50 320 Q 150 370 350 320 T 750 320 T 1150 320 T 1350 320" fill="none" stroke="url(#accentGrad)" stroke-width="1.5"/>
  </g>

  <!-- FOREGROUND TEXT AND BADGES (Always sharp, high contrast, readable) -->
  <g transform="translate(80, 0)">
    <!-- Pill Category Badge -->
    <g transform="translate(0, 68)">
      <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="18" cy="16" r="5" fill="#38bdf8"/>
      <text x="32" y="21" fill="#38bdf8" class="badge-text">CURATED RESEARCH ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="152" fill="url(#primaryGrad)" class="main-title">
      Awesome Computational
    </text>
    <text x="0" y="202" fill="#f8fafc" class="main-title">
      Chemistry &amp; Biology 🧬
    </text>

    <!-- Subtitle / Mission -->
    <text x="0" y="246" fill="#94a3b8" class="subtitle">
      Molecular Dynamics · Docking · Cheminformatics · Quantum Chemistry · AI Potentials
    </text>

    <!-- Tag Pills Row -->
    <g transform="translate(0, 276)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="65" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ High-Perf MD</text>
      
      <!-- Tag 2 -->
      <rect x="142" y="0" width="145" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="214" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">🎯 Molecular Docking</text>
      
      <!-- Tag 3 -->
      <rect x="299" y="0" width="140" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="369" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">🤖 ML Potentials</text>

      <!-- Tag 4 -->
      <rect x="451" y="0" width="125" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="513" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">🔬 Drug Discovery</text>
    </g>
  </g>
</svg>
